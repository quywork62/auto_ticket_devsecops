name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  secret-guard:
    name: Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Block tracked secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_file_re = re.compile(
              r"(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|keystore)$|"
              r"credentials\.json$|service-account.*\.json$|secrets?/)",
              re.IGNORECASE,
          )
          allowed_files = {".env.example"}
          forbidden_files = [
              path for path in files
              if forbidden_file_re.search(path) and path not in allowed_files
          ]
          if forbidden_files:
              print("Blocked: these tracked files look like secrets or private credentials:")
              print("\n".join(forbidden_files))
              sys.exit(1)

          secret_re = re.compile(
              r"AKIA[0-9A-Z]{16}|"
              r"-----BEGIN ([A-Z ]+)?PRIVATE KEY-----|"
              r"ghp_[A-Za-z0-9_]{20,}|"
              r"github_pat_[A-Za-z0-9_]{20,}|"
              r"glpat-[A-Za-z0-9_-]{20,}|"
              r"xox[baprs]-[A-Za-z0-9-]{10,}|"
              r"(api[_-]?key|token|secret|password)\s*[:=]\s*['\"][^'\"]{12,}",
              re.IGNORECASE,
          )
          ignored_suffixes = {".md"}
          ignored_prefixes = ("tests/", ".github/workflows/")
          ignored_files = {".env.example"}
          findings = []
          for path in files:
              if path in ignored_files or path.startswith(ignored_prefixes):
                  continue
              if Path(path).suffix in ignored_suffixes:
                  continue
              try:
                  text = Path(path).read_text(errors="ignore")
              except OSError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if secret_re.search(line):
                      findings.append(f"{path}:{lineno}:{line[:160]}")
          if findings:
              print("Blocked: possible hardcoded secret found:")
              print("\n".join(findings))
              sys.exit(1)
          PY

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: secret-guard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - secret-guard
      - unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devsecops-auto-ticket:ci
